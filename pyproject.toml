[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waymark"
version = "0.1.0"
description = "Waymark tracks your target roles, maps their hiring cycles, and notifies you the moment they open."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aviral Agarwal" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "anthropic>=0.84,<1",
  "beautifulsoup4>=4.13,<5",
  "openpyxl>=3.1.5,<4",
  # Not imported directly: openpyxl uses it, when installed, to parse uploaded
  # workbooks without expanding hostile XML.
  "defusedxml>=0.7.1,<1",
  "tzdata>=2025.1",
  "argon2-cffi>=23.1,<26",
  "psycopg[binary]>=3.2,<4",
]

[project.urls]
Homepage = "https://waymark.aviralagarwal.com"
Source = "https://github.com/aviralagarwal1/waymark"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["waymark*"]

[tool.setuptools.package-data]
waymark = ["brand.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["waymark/**/*.py", "tests/**/*.py", "evaluations/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
