services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATA_DIR: /data
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-preview}
      STATIC_DIR: /app/web/dist
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
    command: ["python", "-m", "uvicorn", "waymark.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    build: .
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATA_DIR: /data
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-preview}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
    command: ["python", "-m", "waymark.worker"]
    depends_on:
      - web
    restart: unless-stopped
