name: Deploy

# Deploys the hosted instance at waymark.aviralagarwal.com after CI passes on
# master. Forks skip it: the Google Cloud identity below trusts only this
# repository's master branch, so it could not sign in from anywhere else.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: waymark-production-app
  REGION: us-east4
  IMAGE: us-east4-docker.pkg.dev/waymark-production-app/waymark/app
  SITE: https://waymark.aviralagarwal.com

jobs:
  deploy:
    # A workflow_run fires for pull requests too, including a fork's branch
    # named master; deploy only what was pushed to this repository.
    if: >-
      github.repository == 'aviralagarwal1/waymark' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/274689363343/locations/global/workloadIdentityPools/github/providers/github
          service_account: waymark-deploy@waymark-production-app.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${{ steps.tag.outputs.tag }}" .
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Deploy the web service
        run: gcloud run deploy waymark --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE:${{ steps.tag.outputs.tag }}" --quiet

      - name: Point the worker job at the new image
        run: gcloud run jobs update waymark-worker --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE:${{ steps.tag.outputs.tag }}" --quiet

      # One worker pass reaches the database and the outbox with the new code;
      # the requests show the site answers and still requires a session.
      - name: Smoke test
        run: |
          gcloud run jobs execute waymark-worker --project "$PROJECT_ID" --region "$REGION" --wait
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/auth/me")" = 401
